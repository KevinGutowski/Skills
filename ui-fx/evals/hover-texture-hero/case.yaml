schema_version: "1.1"
name: hover-texture-hero
expected_outcome: |
  The answer gives the shadcn install command for the free Beam texture (npx shadcn@latest add https://textures.dev/r/beam.json or an equivalent registry form) instead of hand-writing an imitation, and runs nothing. The hero code sizes the host (position: relative and a height or aspect ratio) and never sets width or height on the Texture, lets the texture take the pointer so the lines actually react (no `pointer-events: none` on the texture layer), while keeping the button clickable and keyboard reachable (a pointer-events-none content layer sets the button back to auto), and keeps the headline legible over the lines. For phones it recognises that the texture plays by itself on hover-less screens and, under the five-second rule, turns that off (data-motion other than "ambient" on an ancestor, or the static prop) or adds a visible control, and it leaves the file's own reduced-motion handling in place.
