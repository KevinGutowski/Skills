name: open-request-picks-a-moment
expected_outcome: |
  The answer names the commit-to-result moment as the place for the effect, offers more than one option at different costs alongside the build, leading with an ambitious one, starts the effect from the Pay button, fires the payment request immediately, plays success only when the real response arrives, makes the confirmed outcome readable at once in text the effect does not cover, and includes reduced-motion and no-WebGL fallbacks plus a text status.
